name: Build ISO

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, to pick up Arch updates

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install pixi
        run: curl -fsSL https://github.com/prefix-dev/pixi/releases/latest/download/pixi-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin

      - name: Lint
        run: pixi run --locked lint

      - name: Build ISO
        env:
          NANDI_ENGINE: docker
        run: pixi run --locked build-iso

      - name: Boot test (QEMU)
        env:
          NANDI_ENGINE: docker
        run: pixi run --locked test-iso

      - name: Upload boot test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: out/test/
          if-no-files-found: ignore

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nandios-iso
          path: |
            out/*.iso
            out/*.iso.sha256
          compression-level: 0
          retention-days: 14
