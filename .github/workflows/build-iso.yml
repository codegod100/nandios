name: Build ISO

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, to pick up Arch updates

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

env:
  NANDI_ENGINE: docker
  # The runner's second disk has plenty of room for mkarchiso's scratch space.
  NANDI_WORK_DIR: /mnt/nandi/work
  NANDI_PKG_CACHE: /mnt/nandi/pkg

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          sudo mkdir -p /mnt/nandi && sudo chown "$(id -u):$(id -g)" /mnt/nandi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          curl -fsSL https://github.com/prefix-dev/pixi/releases/latest/download/pixi-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin
          df -h / /mnt

      - name: Lint
        run: pixi run --locked lint

      - name: Builder image
        run: pixi run --locked builder

      # Rebuild the Nandi packages only when their PKGBUILDs, the kde repo or
      # the Qt/Plasma libraries they link against have changed.
      - name: Package cache key
        id: pkgkey
        run: |
          kde=$(git ls-remote https://github.com/codegod100/kde HEAD | cut -f1)
          libs=$(docker run --rm localhost/nandios-builder:latest \
            pacman -Si qt6-base qt6-declarative libplasma kio kxmlgui kstatusnotifieritem kwin \
            | grep -E '^(Name|Version)' | sha256sum | cut -c1-16)
          echo "NANDI_KDE_REF=$kde" >> "$GITHUB_ENV"
          echo "key=pkgs-${{ hashFiles('packages/**') }}-${kde:0:12}-$libs" >> "$GITHUB_OUTPUT"

      - name: Restore packages
        id: pkgcache
        uses: actions/cache/restore@v4
        with:
          path: out/repo
          key: ${{ steps.pkgkey.outputs.key }}

      - name: Build packages
        if: steps.pkgcache.outputs.cache-hit != 'true'
        run: pixi run --locked build-packages

      - name: Save packages
        if: steps.pkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/repo
          key: ${{ steps.pkgkey.outputs.key }}

      - name: Build ISO
        run: pixi run --locked rebuild-iso

      - name: Boot test (QEMU)
        run: pixi run --locked test-iso

      - name: Report boot test
        if: always()
        run: |
          [ -f out/test/summary.txt ] || exit 0
          { echo '### Boot test'; echo '```'; cat out/test/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          while read -r case result; do
            if [ "$result" = PASS ]; then
              checks=$(grep -a NANDI_CHECKS "out/test/$case.serial.log" 2>/dev/null | tail -n1 | tr -d '\r' || true)
              echo "::notice title=boot-$case::PASS ${checks#NANDI_CHECKS }"
            else
              tail -c 3500 "out/test/$case.serial.log" 2>/dev/null | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > /tmp/tail || true
              echo "::error title=boot-$case-$result::$(cat /tmp/tail)"
            fi
          done < out/test/summary.txt

      - name: Upload boot test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: out/test/
          if-no-files-found: ignore

      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nandios-iso
          path: |
            out/*.iso
            out/*.iso.sha256
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
