# Limine config for the live ISO. build-iso.sh replaces @UUID@ and @MODULES@.
timeout: 5
interface_branding: Nandi OS
interface_branding_colour: 6

/Nandi OS live
    protocol: linux
    path: boot():/arch/boot/x86_64/vmlinuz-linux
    cmdline: archisobasedir=arch archisosearchuuid=@UUID@ console=ttyS0,115200 console=tty0
@MODULES@

/Nandi OS live (safe graphics)
    protocol: linux
    path: boot():/arch/boot/x86_64/vmlinuz-linux
    cmdline: archisobasedir=arch archisosearchuuid=@UUID@ console=ttyS0,115200 console=tty0 nomodeset
@MODULES@

/Nandi OS live (copy to RAM)
    protocol: linux
    path: boot():/arch/boot/x86_64/vmlinuz-linux
    cmdline: archisobasedir=arch archisosearchuuid=@UUID@ console=ttyS0,115200 console=tty0 copytoram
@MODULES@
