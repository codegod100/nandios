[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Local repo with the Nandi packages; build-iso.sh fills in the path.
[nandi]
SigLevel = Optional TrustAll
Server = file://@NANDI_REPO@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
