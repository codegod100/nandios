# Baloo can be started (e.g. by D-Bus activation of org.kde.baloo) before
# Plasma imports WAYLAND_DISPLAY/DISPLAY into the systemd user manager.
# baloo_file then hands that empty environment to every baloo_file_extractor
# it spawns, which aborts in Qt platform init, and the cycle repeats.
# ($$ is systemd's escape for a literal $.) systemd builds each command's environment when it is spawned, so waiting
# here makes ExecStart inherit the display variables once Plasma sets them.
[Service]
ExecStartPre=/bin/sh -c 'for i in $$(seq 60); do systemctl --user show-environment | grep -qE "^(WAYLAND_DISPLAY|DISPLAY)=" && exit 0; sleep 1; done; echo "no display in user environment after 60s" >&2; exit 1'
